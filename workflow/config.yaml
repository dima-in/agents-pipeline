workflow:
  executor: direct_api
  mode: interactive
  auto_continue_delay: 3
  max_phase_cost_usd:
  default_implementation_scope: "Implement backend-only MVP provider performance monitoring and smart routing foundation. No marketplace, no Stripe changes, no frontend changes except API client stubs if required."
  implementation_scope_policy:
    allowed_paths:
      - gateway-v4/app/services/monitoring.py
      - gateway-v4/app/services/routing.py
      - gateway-v4/app/services/proxy.py
      - gateway-v4/app/routers/chat.py
      - gateway-v4/app/routers/admin.py
      - gateway-v4/app/models.py
      - gateway-v4/app/database.py
      - gateway-v4/alembic/versions/*
      - gateway-v4/tests/*
      - tests/*
      - docs/*
      - README.md
      - gateway-v4/README.md
    forbidden_paths:
      - frontend/*
      - gateway-v4/app/routers/billing.py
      - gateway-v4/app/routers/auth.py
      - gateway-v4/app/services/auth.py
      - gateway-v4/app/services/billing.py
      - gateway-v4/app/services/marketplace.py
      - .github/*
      - docker-compose.yml
      - docker-compose.prod.yml
      - gateway-v4/docker-compose.yml
      - gateway-v4/docker-compose.prod.yml
      - gateway-v4/Dockerfile
      - gateway-v4/Dockerfile.prod
    forbidden_keywords:
      - stripe
      - billing
      - subscription
      - payment
      - checkout
      - marketplace
    max_changed_files: 8
    max_diff_lines: 320
  require_registry_preflight: false
  require_model_list_preflight: false
  phase_order:
    - research
    - implementation
    - deployment

project:
  name: agents-pipeline
  workspace: .
  default_branch: main

runtime:
  provider: openrouter
  model: openrouter/anthropic/claude-sonnet-4.5
  thinking: low

paths:
  agents_dir: .openclaw/agents
  logs_dir: .openclaw/logs
  feedback_dir: .openclaw/feedback

phases:
  research:
    name: "Research"
    requires_approval: true
    approval_prompt: "Подтвердить результаты исследования?"
    agents:
      - name: project-analyst
        description: "Analyze the current repository, constraints, gaps, and immediate opportunities"
        timeout: 900
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: competitor-analyst
        description: "Analyze competitors"
        timeout: 600
        provider: openrouter
        model: perplexity/sonar
        thinking: low
      - name: market-analyst
        description: "Analyze market and trends"
        timeout: 600
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: tech-analyst
        description: "Review technical options"
        timeout: 600
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: innovation-scout
        description: "Find adjacent product and workflow innovations"
        timeout: 600
        provider: openrouter
        model: perplexity/sonar
        thinking: low
      - name: product-manager
        description: "Summarize and prepare requirements"
        timeout: 900
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low

  implementation:
    name: "Implementation"
    agents:
      - name: architect
        description: "Prepare technical plan"
        timeout: 900
        provider: openrouter
        model: openrouter/deepseek/deepseek-chat-v3
        thinking: low
      - name: implementation-planner
        description: "Convert the architect plan into a prioritized implementation backlog"
        timeout: 900
        provider: openrouter
        model: openrouter/deepseek/deepseek-chat-v3
        thinking: low
      - name: developer
        description: "Implement the task"
        timeout: 2400
        max_retries: 3
        provider: openrouter
        model: openrouter/deepseek/deepseek-chat-v3
        thinking: low
      - name: qa
        description: "Run checks and report regressions"
        timeout: 900
        provider: openrouter
        model: openrouter/deepseek/deepseek-chat-v3
        thinking: low
      - name: template-validator
        description: "Validate output against template"
        timeout: 600
        provider: openrouter
        model: openrouter/deepseek/deepseek-chat-v3
        thinking: low

  deployment:
    name: "Deployment Readiness"
    requires_approval: true
    approval_prompt: "Подтвердить готовность к production и план запуска?"
    agents:
      - name: production-readiness-checker
        description: "Check production readiness, release risks, and launch blockers"
        timeout: 900
        provider: openrouter
        model: openrouter/deepseek/deepseek-chat-v3
        thinking: low
      - name: launch-strategist
        description: "Prepare launch plan, channels, and rollout checklist after readiness approval"
        timeout: 900
        provider: openrouter
        model: openrouter/deepseek/deepseek-chat-v3
        thinking: low

git:
  enabled: true
  strategy: feature-branch
  branch_prefix: feature/
  auto_rollback: true

logging:
  level: INFO
  console: true
  file: true
  json: true
