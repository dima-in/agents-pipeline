workflow:
  executor: direct_api
  mode: interactive
  console_language: ru
  auto_continue_delay: 3
  max_phase_cost_usd:
  default_implementation_scope: "Implement one small, safe, backend-first improvement that fits the target repository's existing architecture and conventions."
  # Scope policy is project-agnostic by default (see _default_implementation_scope_policy):
  # only universal infra files are forbidden globally; sensitive files (billing/auth/payment/
  # marketplace/...) are derived per-target from forbidden_keywords against the repo_map; and
  # each project declares its own allowed/forbidden paths in its per-project settings.yaml.
  # Uncomment and edit implementation_scope_policy below ONLY for a machine-wide override
  # that should apply to every target repository.
  # implementation_scope_policy:
  #   forbidden_keywords: [stripe, billing, subscription, payment, checkout, marketplace]
  #   max_changed_files: 8
  #   max_diff_lines: 500
  require_registry_preflight: false
  require_model_list_preflight: false
  phase_order:
    - research
    - implementation
    - deployment

project:
  name: agents-pipeline
  workspace: .
  default_branch: main

runtime:
  provider: openrouter
  model: openrouter/anthropic/claude-sonnet-4.6
  thinking: low

paths:
  agents_dir: .openclaw/agents
  logs_dir: .openclaw/logs
  feedback_dir: .openclaw/feedback

phases:
  research:
    name: "Research"
    requires_approval: true
    approval_prompt: "Подтвердить результаты исследования?"
    agents:
      - name: project-analyst
        description: "Analyze the current repository, constraints, gaps, and immediate opportunities"
        timeout: 900
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: competitor-analyst
        description: "Analyze competitors"
        timeout: 600
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: market-analyst
        description: "Analyze market and trends"
        timeout: 600
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: tech-analyst
        description: "Review technical options"
        timeout: 600
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: innovation-scout
        description: "Find adjacent product and workflow innovations"
        timeout: 600
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: product-manager
        description: "Summarize and prepare requirements"
        timeout: 900
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low

  implementation:
    name: "Implementation"
    execution_mode: multi_developer_json
    default_alembic_down_revision: "0005"
    multi_developer_agents:
      - name: code-developer
        description: "Write application code only"
        timeout: 1800
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: infra-developer
        description: "Write migrations and config only"
        timeout: 1800
        provider: openrouter
        model: gpt-5.4
        thinking: medium
      - name: test-developer
        description: "Write pytest tests only"
        timeout: 1200
        provider: openrouter
        model: gpt-5.4
        thinking: medium
    agents:
      - name: codebase-profiler
        description: "Profile the target's current architecture; fill gaps the detectors could not"
        timeout: 600
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: architect
        description: "Prepare technical plan"
        timeout: 900
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: implementation-planner
        description: "Convert the architect plan into a prioritized implementation backlog"
        timeout: 900
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: task-designer
        description: "Convert the selected backlog item into a machine-executable developer contract"
        timeout: 900
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low
      - name: developer
        description: "Implement the task"
        timeout: 2400
        max_retries: 3
        provider: openrouter
        model: gpt-5.4
        thinking: low
      - name: qa
        description: "Run checks and report regressions"
        timeout: 900
        provider: openrouter
        model: gpt-5.4
        thinking: low
      - name: template-validator
        description: "Validate output against template"
        timeout: 600
        provider: openrouter
        model: openrouter/anthropic/claude-sonnet-4.5
        thinking: low

  deployment:
    name: "Deployment Readiness"
    requires_approval: true
    approval_prompt: "Подтвердить готовность к production и план запуска?"
    agents:
      - name: production-readiness-checker
        description: "Check production readiness, release risks, and launch blockers"
        timeout: 900
        provider: openrouter
        model: openrouter/deepseek/deepseek-v4-pro
        thinking: low
      - name: launch-strategist
        description: "Prepare launch plan, channels, and rollout checklist after readiness approval"
        timeout: 900
        provider: openrouter
        model: openrouter/deepseek/deepseek-v4-pro
        thinking: low

git:
  enabled: true
  strategy: feature-branch
  branch_prefix: feature/
  auto_rollback: true
  rollback_dirty_strategy: stash

logging:
  level: INFO
  console: true
  # compact: console shows only the operator cards (Передача/Готово/Human summary),
  # agent start/end with status+reason, git and phase lines; all service output
  # (Diagnostic, prompt dumps, raw agent responses, retrieval turns) goes to the
  # log file only. Set to "verbose" to print everything as before.
  console_verbosity: compact
  file: true
  json: true
